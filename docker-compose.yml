services:
  summariser:
    build: .
    image: kiwix-summariser:latest
    container_name: kiwix-summariser
    env_file: .env
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped
    # Only needed if you refer to Kiwix/Ollama by hostname instead of IP:
    # reuse the host resolver so LAN names like "kiwix" resolve in-container.
    # Point `dns` at your own router/resolver (192.0.2.1 is a placeholder).
    # dns:
    #   - 192.0.2.1
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
